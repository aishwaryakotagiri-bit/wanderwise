<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 -38 432 412" role="img" aria-label="Wanderwise">
  <defs>
    <!-- Die-cut sticker: white border with a soft rim, lifted by a contact shadow. -->
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="28" result="d" />
      <feGaussianBlur in="d" stdDeviation="3" result="db" />
      <feComponentTransfer in="db" result="cut"><feFuncA type="linear" slope="3" intercept="-1" /></feComponentTransfer>
      <feMorphology in="cut" operator="dilate" radius="3.5" result="rimShape" />
      <feFlood flood-color="#E3E1DC" /><feComposite in2="rimShape" operator="in" result="rim" />
      <feFlood flood-color="#FFFFFF" /><feComposite in2="cut" operator="in" result="white" />
      <feOffset in="rimShape" dy="10" result="o" />
      <feGaussianBlur in="o" stdDeviation="12" result="ob" />
      <feFlood flood-color="#000000" flood-opacity=".14" /><feComposite in2="ob" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" /><feMergeNode in="rim" /><feMergeNode in="white" /><feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#sticker)">
    <g transform="rotate(-8 170 165)" stroke="#2B2B2B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M130 72 V44 Q130 32 142 32 H198 Q210 32 210 44 V72" fill="none"/>
      <rect x="30" y="72" width="280" height="196" rx="30" fill="#9F2BCF"/>
      <rect x="86" y="72" width="30" height="196" fill="#D39CED"/>
      <rect x="224" y="72" width="30" height="196" fill="#D39CED"/>
      <rect x="76" y="152" width="50" height="34" rx="7" fill="#FEBA3B"/>
      <rect x="214" y="152" width="50" height="34" rx="7" fill="#FEBA3B"/>
      <circle cx="84" cy="286" r="10" fill="#2B2B2B"/>
      <circle cx="276" cy="286" r="10" fill="#2B2B2B"/>
      <path d="M52 112 Q52 100 62 98" fill="none" stroke="#E3BFF3" stroke-width="7"/>
    </g>
  </g>
</svg>
