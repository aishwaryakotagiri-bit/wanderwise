<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="-12 -12 88 88" role="img" aria-label="Wanderwise logo">
  <!-- Wanderwise suitcase sticker, from Claude Design (Wanderwise Logo). Tilt it with CSS: transform: rotate(-8deg). -->
  <filter id="die" x="-35%" y="-35%" width="170%" height="180%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4.4" result="g"/>
    <feFlood flood-color="#E3E1DC"/>
    <feComposite in2="g" operator="in" result="gr"/>
    <feMorphology in="SourceAlpha" operator="dilate" radius="3.6" result="d"/>
    <feFlood flood-color="#FFFFFF"/>
    <feComposite in2="d" operator="in" result="w"/>
    <feOffset in="g" dy="3" result="o"/>
    <feGaussianBlur in="o" stdDeviation="3" result="ob"/>
    <feFlood flood-color="#000000" flood-opacity=".14"/>
    <feComposite in2="ob" operator="in" result="sh"/>
    <feMerge>
      <feMergeNode in="sh"/>
      <feMergeNode in="gr"/>
      <feMergeNode in="w"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#die)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M24 18 V12 Q24 9 27 9 H37 Q40 9 40 12 V18" fill="none" stroke="#2B2B2B" stroke-width="1.8"/>
    <rect x="6" y="18" width="52" height="36" rx="6" fill="#9F2BCF" stroke="#2B2B2B" stroke-width="1.8"/>
    <rect x="18" y="18" width="6" height="36" fill="#D39CED" stroke="#2B2B2B" stroke-width="1.8"/>
    <rect x="40" y="18" width="6" height="36" fill="#D39CED" stroke="#2B2B2B" stroke-width="1.8"/>
    <rect x="16.5" y="32" width="9" height="6" rx="1.5" fill="#FEBA3B" stroke="#2B2B2B" stroke-width="1.8"/>
    <rect x="38.5" y="32" width="9" height="6" rx="1.5" fill="#FEBA3B" stroke="#2B2B2B" stroke-width="1.8"/>
    <path d="M10 24 Q10 22 12 22" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".7"/>
    <circle cx="14" cy="57" r="2.5" fill="#2B2B2B"/>
    <circle cx="50" cy="57" r="2.5" fill="#2B2B2B"/>
  </g>
</svg>
